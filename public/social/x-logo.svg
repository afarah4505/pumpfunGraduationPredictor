    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="400" rx="88" fill="url(#bg)"/>

  <rect x="80" y="80" width="240" height="240" rx="72" fill="#0b1222" stroke="#30415f" stroke-width="10"/>

  <g filter="url(#glow)">
    <path d="M136 246L175 207L201 233L260 174" stroke="#2CF5A0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="260" cy="174" r="18" fill="#2CF5A0"/>
  </g>
</svg>
