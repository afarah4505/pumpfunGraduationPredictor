<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PumpIQ X profile logo">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08101f"/>
      <stop offset="1" stop-color="#111d34"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="400" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
